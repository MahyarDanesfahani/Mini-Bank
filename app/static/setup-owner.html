<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#214c3c"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/static/icon.svg" type="image/svg+xml"><title>راه‌اندازی مدیر | صندوق‌من</title><link rel="stylesheet" href="/static/styles.css"></head><body><main class="setup-shell"><a class="mobile-brand" href="/"><span class="brand-icon">ص</span> صندوق‌من</a><span class="eyebrow">فقط یک‌بار انجام می‌شود</span><h1>راه‌اندازی مدیر صندوق</h1><p>برای ساخت اولین حساب مدیر، کلید راه‌اندازی تنظیم‌شده در فایل محیطی سرور را وارد کنید.</p><div id="setupNotice" class="notice" hidden></div><form id="setupForm" class="app-form setup-form"><label class="span-2">کلید راه‌اندازی<input name="setup_key" type="password" required autocomplete="off"></label><label class="span-2">نام و نام خانوادگی<input name="full_name" required minlength="2"></label><label>کد ملی مدیر<input name="national_code" required pattern="[0-9۰-۹]{10}" maxlength="10" inputmode="numeric"></label><label>شماره موبایل<input name="phone" dir="ltr"></label><label>ایمیل (اختیاری)<input name="email" type="email" dir="ltr"></label><label>گذرواژه<input name="password" type="password" minlength="10" required></label><button class="button primary form-submit span-2">ساخت حساب مدیر</button></form><a class="back-link" href="/">بازگشت به ورود</a></main><script src="/static/setup-owner.js" defer></script><script src="/static/pwa.js" defer></script></body></html>
